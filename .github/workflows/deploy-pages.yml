name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/birthday-card-animation-wr7nsu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Supabase URL and anon key are required; a card site without them is
      # silently broken (no cards load). Set them under Settings -> Secrets and
      # variables -> Actions -> Variables. All four are PUBLIC client keys by
      # design (Supabase anon/publishable, PostHog phc_). PostHog is optional;
      # analytics degrades gracefully when empty.
      - name: Require Supabase repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          fail=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Repository variable SUPABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            fail=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository variable SUPABASE_ANON_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to deploy a broken site (empty Supabase config)."
            exit 1
          fi
          echo "Supabase variables present. POSTHOG_KEY set: ${{ vars.POSTHOG_KEY != '' }} (optional)."

      # Only these files are public. Internal material (docs/, research/,
      # .planning/, HANDOFF.md, tests/, supabase/) stays out of the artifact.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html card.html maker.html rachel.html photo.jpg og-card.png _site/
          cp -R demo _site/demo
          cp -R shared _site/shared
          rm -f _site/shared/config.example.js
          # GitHub Pages serves 404.html for unknown paths like /c/<token>/,
          # so the card page doubles as the catch-all route.
          cp _site/card.html _site/404.html

      # shared/config.js is gitignored; generate it at deploy time from
      # repository Variables, matching shared/config.example.js exports.
      - name: Write client config from repository variables
        run: |
          cat > _site/shared/config.js <<EOF
          // GENERATED AT DEPLOY from repository Variables. Public client keys only.
          export const SUPABASE_URL = "${{ vars.SUPABASE_URL }}";
          export const SUPABASE_ANON_KEY = "${{ vars.SUPABASE_ANON_KEY }}";
          export const POSTHOG_KEY = "${{ vars.POSTHOG_KEY }}";
          export const POSTHOG_HOST = "${{ vars.POSTHOG_HOST }}";
          EOF

      # Turns GitHub Pages on for this repo (source = GitHub Actions)
      # so no manual settings change is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
