name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/birthday-card-animation-wr7nsu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate shared/config.js at deploy time from repository Variables.
      # config.js is gitignored (never in git history); these are all PUBLIC
      # client keys by design (Supabase anon/publishable, PostHog phc_). Set them
      # under Settings -> Secrets and variables -> Actions -> Variables:
      #   SUPABASE_URL, SUPABASE_ANON_KEY, POSTHOG_KEY, POSTHOG_HOST
      - name: Write client config from repository variables
        run: |
          mkdir -p shared
          cat > shared/config.js <<EOF
          // GENERATED AT DEPLOY from repository Variables. Public client keys only.
          export const SUPABASE_URL = "${{ vars.SUPABASE_URL }}";
          export const SUPABASE_ANON_KEY = "${{ vars.SUPABASE_ANON_KEY }}";
          export const POSTHOG_KEY = "${{ vars.POSTHOG_KEY }}";
          export const POSTHOG_HOST = "${{ vars.POSTHOG_HOST }}";
          EOF
          # upload-pages-artifact honors .gitignore, which lists shared/config.js,
          # so the generated file would be excluded from the published site. Drop
          # that one line for THIS build only (the runner's checkout; the committed
          # .gitignore is never changed).
          sed -i.bak '/shared\/config\.js/d' .gitignore && rm -f .gitignore.bak
          echo "Wrote shared/config.js (SUPABASE_URL set: ${{ vars.SUPABASE_URL != '' }}, POSTHOG_KEY set: ${{ vars.POSTHOG_KEY != '' }})"

      # Turns GitHub Pages on for this repo (source = GitHub Actions)
      # so no manual settings change is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
