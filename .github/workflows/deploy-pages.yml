name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/birthday-card-animation-wr7nsu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Supabase URL and anon key are required; a card site without them is
      # silently broken (no cards load). Set them under Settings -> Secrets and
      # variables -> Actions -> Variables. All four are PUBLIC client keys by
      # design (Supabase anon/publishable, PostHog phc_). PostHog is optional;
      # analytics degrades gracefully when empty.
      - name: Require Supabase repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          fail=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Repository variable SUPABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            fail=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository variable SUPABASE_ANON_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to deploy a broken site (empty Supabase config)."
            exit 1
          fi
          echo "Supabase variables present. POSTHOG_KEY set: ${{ vars.POSTHOG_KEY != '' }} (optional)."

      # Only these files are public. Internal material (docs/, research/,
      # .planning/, HANDOFF.md, tests/, supabase/) stays out of the artifact.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html card.html maker.html rachel.html photo.jpg og-card.png _site/
          cp -R demo _site/demo
          cp -R shared _site/shared
          cp -R assets _site/assets
          rm -f _site/shared/config.example.js
          # 404.html (the /c/<token>/ catch-all) is written later, after the
          # per-theme link preview steps have retargeted card.html's og:image.

      # The served site must never phone Google Fonts. Pull the css2 stylesheet
      # once at deploy (Chrome UA so woff2 is served), save every face under
      # _site/fonts/, and point index/card/maker at the local copy. The href
      # stays relative on purpose: deep /c/<token>/ routes resolve it through
      # the injected <base>. rachel.html is frozen and keeps its committed
      # Google Fonts links. Runs before the per-theme step, so card-sage, dusk,
      # sky and 404.html all inherit the rewritten card.html. Fail-open: if any
      # download breaks, the staged HTML is left untouched and the committed
      # async Google Fonts setup still works.
      - name: Self-host fonts
        run: |
          python3 - <<'PYEOF'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          SITE = Path("_site")
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")

          def bail(msg):
              print("::warning::Self-host fonts skipped: " + msg
                    + " The pages keep their async Google Fonts links.")
              sys.exit(0)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read()

          def read(path):
              with open(path, encoding="utf-8", newline="") as f:
                  return f.read()

          def write(path, text):
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(text)

          card = read(SITE / "card.html")
          hit = re.search(r'https://fonts\.googleapis\.com/css2\?[^"\']+', card)
          if not hit:
              bail("no css2 URL found in the staged card.html.")
          css_url = hit.group(0).replace("&amp;", "&")

          # Fetch the CSS and every face it names before touching anything, so
          # a network failure leaves the staged site exactly as committed.
          try:
              css = fetch(css_url).decode("utf-8")
              remotes = []
              for m in re.finditer(r"url\(([^)]+)\)", css):
                  u = m.group(1).strip("'\"")
                  if u not in remotes:
                      remotes.append(u)
              if not remotes:
                  bail("the fonts CSS came back with no url() entries.")
              local = {}
              used = set()
              for u in remotes:
                  name = u.rsplit("/", 1)[-1]
                  if name in used:
                      name = str(len(used)) + "-" + name
                  used.add(name)
                  local[u] = name
              blobs = {name: fetch(u) for u, name in local.items()}
          except Exception as exc:
              bail("could not download the fonts (" + str(exc) + ").")

          fonts = SITE / "fonts"
          fonts.mkdir(exist_ok=True)
          for name, data in blobs.items():
              (fonts / name).write_bytes(data)
          write(fonts / "fonts.css", re.sub(
              r"url\(([^)]+)\)",
              lambda m: "url(" + local[m.group(1).strip("'\"")] + ")",
              css))
          print("Self-host fonts: saved " + str(len(blobs)) + " faces plus fonts.css.")

          LOCAL_LINK = '<link rel="stylesheet" href="fonts/fonts.css" />'

          def relink(html):
              out = html
              # The async-loading explainer comment no longer applies.
              out = re.sub(r"[ \t]*<!--(?:(?!-->)[\s\S])*?Fonts load async"
                           r"(?:(?!-->)[\s\S])*?-->[ \t]*\r?\n?", "", out)
              out = re.sub(r"[ \t]*<noscript>\s*<link\b[^>]*fonts\.googleapis\.com"
                           r"[^>]*>\s*</noscript>[ \t]*\r?\n?", "", out)
              out = re.sub(r'[ \t]*<link\b(?=[^>]*rel="preconnect")'
                           r"(?=[^>]*fonts\.(?:googleapis|gstatic)\.com)[^>]*>[ \t]*\r?\n?",
                           "", out)
              return re.sub(r"<link\b[^>]*fonts\.googleapis\.com/css2[^>]*>",
                            LOCAL_LINK, out)

          # rachel.html is frozen; it ships exactly as committed, Google Fonts
          # and all. Every other page is relinked in memory first and written
          # only after all of them check clean, so a surprise regex miss never
          # leaves the site half-rewritten.
          pages = sorted(p for p in SITE.glob("*.html") if p.name != "rachel.html")
          relinked = {}
          for page in pages:
              out = relink(read(page))
              if re.search(r"fonts\.(?:googleapis|gstatic)\.com", out):
                  bail(page.name + " still pointed at Google Fonts after the rewrite.")
              relinked[page] = out
          for page, out in relinked.items():
              write(page, out)
              print("Self-host fonts: relinked " + page.name)
          PYEOF

      # shared/config.js is gitignored; generate it at deploy time from
      # repository Variables, matching shared/config.example.js exports.
      - name: Write client config from repository variables
        run: |
          cat > _site/shared/config.js <<EOF
          // GENERATED AT DEPLOY from repository Variables. Public client keys only.
          export const SUPABASE_URL = "${{ vars.SUPABASE_URL }}";
          export const SUPABASE_ANON_KEY = "${{ vars.SUPABASE_ANON_KEY }}";
          export const POSTHOG_KEY = "${{ vars.POSTHOG_KEY }}";
          export const POSTHOG_HOST = "${{ vars.POSTHOG_HOST }}";
          EOF

      # Link preview crawlers do not run JS, so each theme needs its own
      # og:image baked into static HTML. Screenshot og-template.html (served
      # from the checkout) once per theme on the runner, where Google Fonts
      # load. Best effort: if Playwright or the render breaks, the fallback
      # step below keeps every preview slot filled and the deploy proceeds.
      - name: Render per-theme link previews
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.56
          npx playwright install --with-deps chromium
          python3 -m http.server 8123 &
          SERVER_PID=$!
          sleep 2
          mkdir -p _site/og
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const themes = ["cream", "sage", "dusk", "sky"];
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1200, height: 630 } });
          for (const t of themes) {
            await page.goto(`http://127.0.0.1:8123/og-template.html?theme=${t}`, { waitUntil: "networkidle" });
            // Give the blocking Google Fonts stylesheet time to settle.
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `_site/og/og-${t}.png` });
            console.log(`rendered _site/og/og-${t}.png`);
          }
          await browser.close();
          EOF
          kill "$SERVER_PID" || true

      # Guarantee all four preview slots exist even when the render step
      # failed (or partially failed): fill any gap with the branded og-card.png,
      # so no card ever unfurls with a broken image.
      - name: Fallback link previews
        run: |
          mkdir -p _site/og
          for t in cream sage dusk sky; do
            [ -f "_site/og/og-$t.png" ] || cp og-card.png "_site/og/og-$t.png"
          done

      # Static host, so per-theme og:image means per-theme HTML: card-sage,
      # card-dusk and card-sky are the staged card.html with only the og:image
      # content attribute retargeted (saveCard picks the matching variant in
      # production). card.html itself points at the cream preview, and 404.html
      # (the /c/<token>/ catch-all GitHub Pages serves for unknown paths) is
      # copied from it AFTER that sed so clean links keep the cream preview.
      - name: Generate per-theme card pages
        run: |
          for t in sage dusk sky; do
            sed 's|\(property="og:image" content="[^"]*\)og-card\.png|\1og/og-'"$t"'.png|' _site/card.html > "_site/card-$t.html"
          done
          sed -i 's|\(property="og:image" content="[^"]*\)og-card\.png|\1og/og-cream.png|' _site/card.html
          cp _site/card.html _site/404.html

      # Turns GitHub Pages on for this repo (source = GitHub Actions)
      # so no manual settings change is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
